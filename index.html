<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMBH Asset Capture</title>
<meta name="theme-color" content="#17303d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Layout idea: a plant-room clipboard. One column, big touch targets, a rating-plate
   header band, and a sticky action bar the thumb can always reach. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --sunk:#e3e8ec; --ink:#14232d; --muted:#566772;
  --line:#cdd6dc; --plate:#17303d; --plate-ink:#f2f6f8;
  --accent:#e08a00; --accent-ink:#1c1300; --accent-soft:#fff1d6;
  --good:#1f7a4d; --good-soft:#dff3e8; --warn:#a35a00; --warn-soft:#ffe9c7; --bad:#b3261e; --bad-soft:#fde3e1;
  --ai:#0b6b8a; --ai-soft:#dff2f8;
  --display:"Arial Narrow","Roboto Condensed","Helvetica Neue",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
  --s1:#1f7a4d; --s2:#5b8f2a; --s3:#a67c00; --s4:#c05a12; --s5:#b3261e; --s0:#6b7a84;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f181d; --surface:#18242b; --sunk:#111b21; --ink:#e8eef1; --muted:#9bacb6;
    --line:#2c3c46; --plate:#0a1317; --plate-ink:#e8eef1;
    --accent:#f5a623; --accent-ink:#1c1300; --accent-soft:#3a2b0c;
    --good:#58c48c; --good-soft:#133224; --warn:#f0b35a; --warn-soft:#3a2b0c; --bad:#ff8a80; --bad-soft:#3d1a18;
    --ai:#6cc7e3; --ai-soft:#0f303b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f181d; --surface:#18242b; --sunk:#111b21; --ink:#e8eef1; --muted:#9bacb6;
  --line:#2c3c46; --plate:#0a1317; --plate-ink:#e8eef1;
  --accent:#f5a623; --accent-ink:#1c1300; --accent-soft:#3a2b0c;
  --good:#58c48c; --good-soft:#133224; --warn:#f0b35a; --warn-soft:#3a2b0c; --bad:#ff8a80; --bad-soft:#3d1a18;
  --ai:#6cc7e3; --ai-soft:#0f303b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:filter .1s,transform .08s,background-color .15s,border-color .15s}
button:active:not(:disabled){filter:brightness(.86);transform:scale(.97)}
.btn.good,.btn.good:disabled{background:var(--good);border-color:var(--good);color:#fff;opacity:1}
@media (prefers-reduced-motion: reduce){button{transition:none}button:active:not(:disabled){transform:none}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}

/* header band */
.plate{background:var(--plate);color:var(--plate-ink)}
.plate .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}
.plate h1{font-size:26px;line-height:1.05;text-transform:uppercase}
.plate p{margin:2px 0 0;font-size:13px;opacity:.8}
.plate .grow{flex:1;min-width:0}
.rivet{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.plate button{background:transparent;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:999px;padding:8px 14px;min-height:40px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.big{min-height:60px;font-size:18px}

/* list view */
.summary{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--sunk);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
.cards{display:flex;flex-direction:column;gap:10px;padding:8px 0 120px}
.card{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.card .thumb{width:72px;height:72px;border-radius:8px;background:var(--sunk);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--muted);font-size:12px}
.card .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card .name{font-weight:600;overflow-wrap:anywhere}
.card .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.card .num{font-family:var(--display);font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums;align-self:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;margin-top:8px}
.empty h2{font-size:22px;margin-bottom:8px}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 14px;z-index:5}
.bar .wrap{display:flex;gap:10px}
.bar .btn{flex:1}
.note{font-size:13px;color:var(--muted)}
.banner{border-radius:var(--r);padding:10px 12px;margin-top:12px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}

/* edit view */
.photos{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.photo{position:relative;flex:none}
.photo img{width:112px;height:112px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:var(--sunk)}
.photo button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aistatus{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-radius:var(--r);padding:10px 12px;background:var(--ai-soft);color:var(--ai);font-size:14px;margin-top:10px}
.aistatus.bad{background:var(--bad-soft);color:var(--bad)}
.aistatus .grow{flex:1;min-width:60%}
.aistatus button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 12px;min-height:36px;font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
section.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
section.grp>details>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;font-family:var(--display);font-size:20px;text-transform:uppercase;cursor:pointer}
section.grp>details>summary::-webkit-details-marker{display:none}
section.grp>details>summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--muted)}
section.grp>details[open]>summary::after{content:"–"}
section.grp .count{font:600 12px var(--body);color:var(--muted);text-transform:none}
.fields{display:flex;flex-direction:column;gap:12px;padding:0 14px 14px}
.f label,.f .lab{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.f .req{color:var(--bad)}
.f input,.f select,.f textarea,.pick{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.f textarea{min-height:84px;resize:vertical}
.f.ai input{border-color:var(--ai);background:var(--ai-soft)}
.pick{display:flex;align-items:center;gap:8px;text-align:left;overflow-wrap:anywhere}
.pick .val{flex:1;min-width:0}
.pick .ph{color:var(--muted)}
.pick .go{color:var(--muted);flex:none}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sugg button{text-align:left;border:1px solid var(--ai);background:var(--ai-soft);color:var(--ink);border-radius:10px;padding:8px 10px;min-height:44px;overflow-wrap:anywhere}
.sugg .cap{font-size:12px;font-weight:600;color:var(--ai)}
.editpad{padding-bottom:120px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.optb{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500;text-align:left}
.optb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.optb .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--body);color:#fff;flex:none}
.optb svg{width:22px;height:22px;flex:none;color:var(--muted)}
.optb[aria-pressed="true"] svg{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:13px;font-weight:600;text-align:center;min-height:92px}
.tile svg{width:28px;height:28px;color:var(--accent)}
.tile small{font-weight:400;color:var(--muted)}
.linkb{border:0;background:transparent;color:var(--ai);font-weight:600;padding:8px 0;min-height:40px;text-decoration:underline;text-align:left}
.reader{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.reader .lab{font-size:13px;font-weight:600;color:var(--muted)}
.rawtext{margin-top:8px;font-size:13px}
.rawtext pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:10px;padding:10px;margin:6px 0 0;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;user-select:text;-webkit-user-select:text}
.zoom{overflow:auto;max-height:70vh;border-radius:10px;background:var(--sunk)}
.zoom img{display:block;width:100%}
.zoom.in img{width:300%;max-width:none}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,14,18,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet header h2{font-size:22px;text-transform:uppercase;flex:1}
.sheet .x{border:0;background:var(--sunk);width:40px;height:40px;border-radius:50%;font-size:20px}
.sheet .body{padding:4px 16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet input[type=search]{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.results{display:flex;flex-direction:column}
.results button{text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 2px;min-height:48px;overflow-wrap:anywhere}
.results button small{display:block;color:var(--muted);font-size:12px}
.results .free{color:var(--ai);font-weight:600}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.opt h3{font-size:19px;text-transform:uppercase}
.opt p{margin:0;font-size:14px;color:var(--muted)}
.tree{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--sunk);border-radius:10px;padding:10px;overflow-x:auto;white-space:pre;margin:0}
.steps{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--plate);color:var(--plate-ink);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90%;text-align:center}
</style>
</head>
<body>

<div id="view-list">
  <div class="plate"><div class="wrap">
    <span class="rivet" aria-hidden="true"></span>
    <div class="grow"><h1>PMBH Asset Capture</h1><p>Building equipment update for the AFMO data load</p></div>
    <button type="button" id="btn-help">Setup</button>
  </div></div>
  <main class="wrap">
    <div id="banner" class="banner" hidden></div>
    <div class="summary" id="summary"></div>
    <div id="list" class="cards"></div>
  </main>
  <div class="bar"><div class="wrap">
    <button type="button" class="btn" id="btn-export">Export Excel</button>
    <button type="button" class="btn primary" id="btn-add">Add asset</button>
  </div></div>
</div>

<div id="view-edit" hidden>
  <div class="plate"><div class="wrap">
    <button type="button" id="btn-back">Back</button>
    <div class="grow"><h1 id="edit-title">New asset</h1><p id="edit-sub"></p></div>
  </div></div>
  <main class="wrap editpad">
    <section class="grp" style="padding:14px">
      <div class="lab" style="font-family:var(--display);font-size:20px;text-transform:uppercase;margin-bottom:8px">Photos</div>
      <div class="photos" id="photos"></div>
      <div class="row2">
        <button type="button" class="btn primary" id="btn-cam">Take photo</button>
        <button type="button" class="btn" id="btn-gal">Choose photo</button>
      </div>
      <input type="file" id="in-cam" accept="image/*" capture="environment" hidden>
      <input type="file" id="in-gal" accept="image/*" multiple hidden>
      <input type="file" id="in-lists" accept=".json,application/json" hidden>
      <p class="note" style="margin:8px 0 0">Fill the frame with the nameplate, square on and out of glare. Add the barcode sticker as a second photo. Tap a photo to zoom in.</p>
      <div class="reader" id="reader"></div>
      <div id="aistatus" hidden></div>
      <details class="rawtext" id="rawtext" hidden><summary>Text found on the plate</summary><pre id="rawpre"></pre></details>
    </section>
    <div id="form"></div>
    <button type="button" class="btn danger block" id="btn-delete" style="margin-top:16px" hidden>Delete this asset</button>
  </main>
  <div class="bar"><div class="wrap">
    <button type="button" class="btn" id="btn-cancel">Cancel</button>
    <button type="button" class="btn primary" id="btn-save">Save asset</button>
  </div></div>
</div>

<div id="sheets"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="lib/xlsx.full.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script>
"use strict";
/* ---------- template definition (column order of "triBuildingEquipment Data") ---------- */
const HEADERS = ["CSTDCRECORDIDTX","TRIIDTX","TRINAMETX","TRISERIALNUMTX","TRIBARCODEENTRYTX","TRIPRIMARYORGANIZATI","CSTOPERATORTX","TRIPRIMARYLOCATIONTX","CSTEQUIPMENTPOSITIONTX","CSTFIXEDORMOBILELI","TRISPECNAMETX","TRIBUILDINGSYSTEMCL","CSTASSETOWNERSHIPSTATU","CSTASSETOWNERSHIPTYPEC","TRIACTIVESTARTDA","CSTMANUFACTUREDATEDA","CSTWARRANTYSTARTDATEDA","CSTWARRANTYEXPIRESDA","TRIPONUMTX","TRIPURCHASECOSTNU","CSTSUPPLIERTX","TRILIFEEXPECTANCYDU","CSTASSETCRITICALITYLI","CSTOPERATINGENVIRONMEN","CSTASSETUTILISATIONLI","TRICONDITIONLI","CSTCONDITIONDA","CSTCONDITIONASSESSMENT","TRICURRENTREPLACEMEN","CSTMAINTENANCETYPELI","TRIMAINTENANCEPRIORI","CSTMAINTENANCESTRATEGY","CSTSERVICEAGENTTX","CSTDCPARENTRECORDIDTX","MARK_TO_IGNORE_FOR_UPLOAD","VALIDATION_ERRORS"];
const OWN = ["Borrowed","Consumables Lease","Donated","Government Grant","Leased","Not Owned","Owned","Purchased","Rented"];
// k = key in a saved asset, col = column in the data sheet (absent = capture log only)
const F = {
  id:{label:"Asset ID",col:"TRIIDTX",type:"text",max:700,hint:"The existing AFMO asset number"},
  atype:{label:"Asset type",type:"pick",src:"types"},
  area:{label:"Service area",type:"text",hint:"Ward, department or block, e.g. ICU, West Block"},
  label:{label:"Asset label",type:"text",hint:"The local label on the asset, e.g. FCU2, Chiller 1, DB20"},
  cap:{label:"Capacity, energy source or utility type",type:"text",hint:"e.g. 5000L, Natural Gas, Essential Power, 250kg"},
  name:{label:"Name",col:"TRINAMETX",type:"text",max:150,req:true,hint:"Built as asset type - service area - asset label - capacity, following the HI naming guide. The brand is not part of the name."},
  serial:{label:"Serial number",col:"TRISERIALNUMTX",type:"text",max:700},
  barcode:{label:"Bar code",col:"TRIBARCODEENTRYTX",type:"text",max:700},
  make:{label:"Make",type:"text"},
  model:{label:"Model",type:"text"},
  spec:{label:"Specification name",col:"TRISPECNAMETX",type:"pick",src:"specs",req:true,max:150},
  cls:{label:"Building system class",col:"TRIBUILDINGSYSTEMCL",type:"pick",src:"classes"},
  mfgDate:{label:"Manufacture date",col:"CSTMANUFACTUREDATEDA",type:"date"},
  location:{label:"Primary location",col:"TRIPRIMARYLOCATIONTX",type:"pick",src:"locations"},
  position:{label:"Equipment position",col:"CSTEQUIPMENTPOSITIONTX",type:"text",max:250,hint:"e.g. plant room north wall, roof above theatre 2"},
  fixed:{label:"Fixed or mobile?",col:"CSTFIXEDORMOBILELI",type:"select",opts:["Fixed","Mobile"],icons:["fixed","mobile"]},
  org:{label:"Organization",col:"TRIPRIMARYORGANIZATI",type:"pick",src:"orgs"},
  operator:{label:"Operator (cost code)",col:"CSTOPERATORTX",type:"pick",src:"costcodes"},
  ownStatus:{label:"Ownership status",col:"CSTASSETOWNERSHIPSTATU",type:"select",opts:OWN},
  ownType:{label:"Ownership type",col:"CSTASSETOWNERSHIPTYPEC",type:"select",opts:OWN},
  inService:{label:"In service date",col:"TRIACTIVESTARTDA",type:"date"},
  warrStart:{label:"Warranty start date",col:"CSTWARRANTYSTARTDATEDA",type:"date"},
  warrEnd:{label:"Warranty expiration date",col:"CSTWARRANTYEXPIRESDA",type:"date"},
  po:{label:"PO number",col:"TRIPONUMTX",type:"text",max:700},
  cost:{label:"Purchase cost",col:"TRIPURCHASECOSTNU",type:"number"},
  supplier:{label:"Supplier",col:"CSTSUPPLIERTX",type:"text",max:150},
  life:{label:"Life expectancy",col:"TRILIFEEXPECTANCYDU",type:"text"},
  criticality:{label:"Asset criticality",col:"CSTASSETCRITICALITYLI",type:"select",opts:["1 - Low","2 - Medium","3 - High","4 - Extreme"],scale:[1,3,4,5]},
  env:{label:"Operating environment",col:"CSTOPERATINGENVIRONMEN",type:"select",opts:["1 - Good","2 - Normal","3 - Poor"],scale:[1,3,5]},
  util:{label:"Asset utilisation",col:"CSTASSETUTILISATIONLI",type:"select",opts:["1 - Low","2 - Normal","3 - High"],scale:[0,0,0]},
  condition:{label:"Asset condition",col:"TRICONDITIONLI",type:"select",opts:["1 - Excellent","2 - Good","3 - Fair","4 - Poor","5 - Defective"],scale:[1,2,3,4,5]},
  assessDate:{label:"Assessment date",col:"CSTCONDITIONDA",type:"date"},
  comments:{label:"Condition assessment comments",col:"CSTCONDITIONASSESSMENT",type:"textarea",max:1000},
  replValue:{label:"Replacement value",col:"TRICURRENTREPLACEMEN",type:"number"},
  maintType:{label:"Maintenance type",col:"CSTMAINTENANCETYPELI",type:"select",opts:["Non Statutory","Statutory"]},
  maintPriority:{label:"Maintenance priority",col:"TRIMAINTENANCEPRIORI",type:"select",opts:["Contract Change","Emergency","High","Low","Medium","New Lease","Update Lease","Urgent"]},
  maintStrategy:{label:"Maintenance strategy",col:"CSTMAINTENANCESTRATEGY",type:"select",opts:["Condition","Preventative Maintenance","Run to Fail"]},
  agent:{label:"Service agent",col:"CSTSERVICEAGENTTX",type:"text",max:150},
  notes:{label:"Other nameplate details",type:"textarea",hint:"Kept in the capture log sheet, not in the data load"},
};
const GROUPS = [
  {t:"Identity and name",open:true,f:["id","barcode","atype","area","label","cap","name"]},
  {t:"Make, model and serial",open:true,f:["make","model","serial","spec","cls","mfgDate","notes"]},
  {t:"Location",open:true,f:["location","position","fixed","org","operator"]},
  {t:"Condition",f:["condition","criticality","env","util","assessDate","comments","life","replValue"]},
  {t:"Ownership and dates",f:["ownStatus","ownType","inService","warrStart","warrEnd"]},
  {t:"Purchase",f:["po","cost","supplier"]},
  {t:"Maintenance",f:["maintType","maintPriority","maintStrategy","agent"]},
];
const STICKY = ["location","area","org","operator","ownStatus","ownType","agent"];
const NAMEPARTS = ["atype","area","label","cap"];
const buildName = r => String(r.atype||"").trim() ? NAMEPARTS.map(k=>String(r[k]||"").trim()).filter(Boolean).join(" - ").slice(0,150) : "";
const SVG = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const ICON = {
  fixed:SVG('<path d="M12 21s6-6 6-11a6 6 0 0 0-12 0c0 5 6 11 6 11z"/><circle cx="12" cy="10" r="2"/>'),

const lists = {};
let packP = null;
function getPack(){
  return packP || (packP = (async () => {
    await Store.ready;
    let p = await Store.getKV("lists");
    if (!p) { try { const r = await fetch("lists/pmbh-lists.json"); if (r.ok) { p = await r.json(); await Store.setKV("lists", p); } } catch(e) {} }
    return p || null;

}
function loadList(name){
  if (!lists[name]) lists[name] = getPack().then(p => { const a = p && p[name]; if (!Array.isArray(a) || !a.length) throw 0;
      const raw = a.map(x => typeof x==="string" ? x : x.t); return {raw, up:raw.map(t => t.toUpperCase()), meta:typeof a[0]==="object" ? a : null}; })
    .catch(() => { lists[name] = null; return {raw:[], up:[], failed:true}; });
  return lists[name];
}
async function importLists(file){
  let p; try { p = JSON.parse(await file.text()); } catch(e) { return toast("That file is not a lists file."); }
  if (!p || !Array.isArray(p.specs) || !Array.isArray(p.locations)) return toast("That file is not a lists file.");
  await Store.setKV("lists", p); packP = null; dictP = null; for (const k of Object.keys(lists)) delete lists[k];
  $("sheets").replaceChildren(); renderList(); toast("Lists loaded: "+p.specs.length.toLocaleString()+" specifications, "+p.locations.length.toLocaleString()+" locations.");
}
const tokens = s => String(s||"").toUpperCase().split(/[^A-Z0-9.\-\/]+/).filter(Boolean);
function searchList(L, q, limit=60){
  const tk = tokens(q); if (!tk.length) return [];
  const out = [];
  for (let i=0;i<L.up.length;i++){ const u=L.up[i]; let ok=true; for (const t of tk) if (!u.includes(t)) { ok=false; break; } if (ok) out.push(i); }
  out.sort((a,b)=>L.up[a].length-L.up[b].length);
  return out.slice(0,limit).map(i=>L.raw[i]);
}
function suggestSpecs(L, make, model, type){
  const mk = tokens(make)[0], md = String(model||"").toUpperCase().trim(), mdc = md.replace(/[\s\-]/g,""), tt = tokens(type).filter(t=>t.length>2).slice(0,3);
  if (!mk && md.length<2) return [];
  const scored = [];
  for (let i=0;i<L.up.length;i++){
    const u = L.up[i]; let s = 0;
    if (md.length>=5 ? (u.includes(md) || u.replace(/[\s\-]/g,"").includes(mdc)) : (md.length>=2 && u.split(/[^A-Z0-9]+/).includes(md))) s += 6;
    if (mk && mk.length>=2 && u.includes(mk)) s += 3;
    if (s) { for (const t of tt) if (u.includes(t.replace(/S$/,""))) s += 1; scored.push([s,i]); }
  }
  scored.sort((a,b)=>b[0]-a[0] || L.up[a[1]].length-L.up[b[1]].length);
  const top = scored.slice(0,6);
  // make-only matches are too loose to be useful unless the type agrees as well
  specExact = !!top.length && top[0][0]>=6;
  return top.filter(([s]) => s>=6 || (s>=4 && !specExact)).slice(0,5).map(([,i])=>L.raw[i]);
}

const Store = {
  mode:"local", assets:null, idb:null, mem:new Map(), kv:new Map(), blobs:new Map(), cloudDown:false, ready:null,
  async init(){
    try { this.idb = await new Promise((res,rej)=>{ const r = indexedDB.open("pmbh-capture",2);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("records")) d.createObjectStore("records",{keyPath:"key"}); if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos"); if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch(e) { this.idb = null; }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}

  tx(store, mode, fn){ return new Promise((res,rej)=>{ const t=this.idb.transaction(store,mode); const rq=fn(t.objectStore(store)); t.oncomplete=()=>res(rq&&rq.result); t.onerror=()=>rej(t.error); }); },
  online(){ return navigator.onLine !== false; },
  async getKV(k){ if (this.idb) { try { return await this.tx("kv","readonly",st=>st.get(k)); } catch(e) {} } return this.kv.get(k); },
  async setKV(k, v){ this.kv.set(k, v); if (this.idb) { try { await this.tx("kv","readwrite",st=>st.put(v,k)); } catch(e) {} } },
  async list(){ return this.idb ? await this.tx("records","readonly",st=>st.getAll()) : [...this.mem.values()]; },
  async put(rec){
    const clean = JSON.parse(JSON.stringify(rec));
    if (this.idb) await this.tx("records","readwrite",st=>st.put(clean)); else this.mem.set(rec.key, clean);
    return clean;
  },
  async syncPending(){ return []; },
  async del(key){ if (this.idb) return await this.tx("records","readwrite",st=>st.delete(key)); this.mem.delete(key); },
  pkey(p){ return p.id ? "c:"+p.id : "l:"+p.local; },
  async addPhoto(blob){
    let p = null;
    if (this.assets && this.online()) { try { const r = await timeout(this.assets.upload(blob,{type:"image/jpeg"}), 25000); p = {id:r.id}; } catch(e) {} }
    if (!p) { const k = newKey(); if (this.idb) { try { await this.tx("photos","readwrite",s=>s.put(blob,k)); } catch(e) {} } p = {local:k}; }
    this.blobs.set(this.pkey(p), blob);
    return p;
  },
  async photoBlob(p){
    const k = this.pkey(p); if (this.blobs.has(k)) return this.blobs.get(k);
    let b = null;
    if (p.id) { try { const r = await fetch("/_blob/"+p.id); if (r.ok) b = await r.blob(); } catch(e) {}
      if (!b) b = await new Promise(res=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext("2d").drawImage(im,0,0); c.toBlob(res,"image/jpeg",.9); }; im.onerror=()=>res(null); im.src="/_blob/"+p.id; }); }
    else if (this.idb) { try { b = await this.tx("photos","readonly",s=>s.get(p.local)); } catch(e) {} }
    if (b) this.blobs.set(k,b);
    return b || null;
  },
  urls:new Map(),
  async photoUrl(p){
    const k = this.pkey(p);
    if (!this.blobs.has(k) && p.id) return "/_blob/"+p.id;
    if (this.urls.has(k)) return this.urls.get(k);
    const b = await this.photoBlob(p); if (!b) return "";

  },
  async delPhoto(p){
    this.blobs.delete(this.pkey(p));
    if (p.id && this.assets) { try { await this.assets.delete(p.id); } catch(e) {} }
    else if (p.local && this.idb) { try { await this.tx("photos","readwrite",s=>s.delete(p.local)); } catch(e) {} }
  },
};

  box.replaceChildren(el("span",{class:"lab",text:"Read the plate"}));
  const mk = (id, text) => el("button",{type:"button",class:"optb","aria-pressed":(id==="device" ? !(reader==="online" && onlineOk()) : (reader==="online" && onlineOk()))?"true":"false",text,onclick:()=>{
    if (id==="online" && !onlineOk()) return openHelp();
    reader = id; try { localStorage.setItem("pmbh-reader", id); } catch(e) {} renderReader(); if (cur && cur.photos.length) readNameplate(); }});
  box.append(mk("device","On this phone"));
  box.append(mk("online","Online OCR"));
}
function setAi(s){
  const box = $("aistatus"); box.replaceChildren();
  if (!s) { box.hidden = true; return; }
  box.hidden = false; box.className = "aistatus"+(s.bad?" bad":"");
  if (s.busy) box.append(el("span",{class:"spin"}));
  box.append(el("span",{class:"grow",text:s.msg}));
  if (s.stop) box.append(el("button",{type:"button",text:"Stop",onclick:()=>aiCtl&&aiCtl.abort()}));
  if (s.retry) box.append(el("button",{type:"button",text:"Read again",onclick:readNameplate}));

let dictP = null;

function getDict(){
  return dictP || (dictP = loadList("specs").then(L => { const makes = new Map();
    for (const s of L.raw) { const p = s.split(" : ").map(x=>x.trim()); if (p.length<2) continue;
      const mk = p.length>=3 ? p[p.length-2] : p[1], md = p.length>=3 ? p[p.length-1] : "", key = mk.toUpperCase();
      if (key.length<3 || JUNK.test(key) || /^[\d\W]+$/.test(key)) continue;
      let e = makes.get(key); if (!e) { e = {name:mk,n:0,models:new Set()}; makes.set(key,e); }

}
const KEYMAP = {make:"make",model:"model",serial:"serial",barcode:"barcode",asset_id:"id",details:"notes",manufacture_date:"mfgDate",asset_type:"atype",asset_label:"label",capacity:"cap"};
async function applyRead(r, forKey){
  const g = k => (r && typeof r[k]==="string") ? r[k].trim() : "";
  const vals = {}; for (const [rk,k] of Object.entries(KEYMAP)) vals[k] = g(rk);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(vals.mfgDate)) vals.mfgDate = "";
  const [T, dict, L] = await Promise.all([loadList("types"), getDict(), loadList("specs")]);
  if (!cur || cur.key!==forKey) return null;
  if (vals.atype) { const i = T.up.indexOf(vals.atype.toUpperCase()); vals.atype = i>=0 ? T.raw[i] : ""; }
  if (vals.make && dict.has(vals.make.toUpperCase())) vals.make = dict.get(vals.make.toUpperCase()).name;   // spell it the way AFM already does
  const got = [];
  for (const [k,v] of Object.entries(vals)) if (v && (!String(cur[k]||"").trim() || aiFilled.has(k))) { cur[k] = v; aiFilled.add(k); got.push(F[k].label.toLowerCase().replace(/,.*$/,"")); }
  if (!cur.nameManual) cur.name = buildName(cur);

}
async function detectBarcode(blobs){

  try { const det = new BarcodeDetector();
    for (const b of blobs) { const bmp = await createImageBitmap(b); const codes = await det.detect(bmp);
      const c = codes.find(c => !/qr|matrix|aztec|pdf/.test(c.format) && c.rawValue && c.rawValue.length<=30); if (c) return c.rawValue; } } catch(e) {}
  return "";
}

/* --- reader 1: on this phone (Tesseract OCR; the photo never leaves the device) --- */

    await w.setParameters({tessedit_pageseg_mode:"11", preserve_interword_spaces:"1"});

}

}
function wordsOf(data){

}
const fold = t => t.toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/[OQD]/g,"0").replace(/[IL]/g,"1").replace(/S/g,"5").replace(/B/g,"8").replace(/Z/g,"2").replace(/G/g,"6");

    for (let j=1;j<=b.length;j++) { row[j] = Math.min(prev[j]+1, row[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); if (row[j]<best) best = row[j]; }

const MONTHS = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
function parseDate(t){

  if ((m = /\b(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/.exec(t))) return ok(+m[1],+m[2],+m[3]);
  if ((m = /\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})\b/.exec(t))) return ok(+m[3],+m[2],+m[1]);
  if ((m = /\b(\d{4})[-\/.](\d{1,2})\b/.exec(t))) return ok(+m[1],+m[2],1);
  if ((m = /\b(\d{1,2})[-\/.](\d{4})\b/.exec(t))) return ok(+m[2],+m[1],1);

const STOP = /^(NO|NUM|NUMBER|NAME|DATE|OF|THE|AND|FOR|VOLTS?|VOLTAGE|HZ|KW|PHASE|MODEL|MOD|SERIAL|SER|TYPE|MADE|IN|CODE|MFG|POWER|INPUT|OUTPUT|RATED|MAX|MIN|WARNING|CAUTION|AUSTRALIA|CHINA|GERMANY|JAPAN|PTY|LTD|CLASS|WEIGHT|CAPACITY)$/i;

const RE_TYPE = /(?:^|[^A-Z])(?:TYPE|TYP|REF|CAT)(?![A-Z])\.?\s*(?:NUMBER|NUM|NO|N0|#)?\.?\s*[:#.\-]*\s*/;
const RE_DATE = /(?:^|[^A-Z])(?:MFG|MFD|MANUFACTURED?|MANUF|DATE|DOM|YEAR|BUILT|PRODUCTION|PROD)(?![A-Z])[A-Z .\/]*[:#.\-]*\s*/;

async function readDevice(){
  if (!cur || !cur.photos.length) return;
  if (aiCtl) aiCtl.abort();
  const forKey = cur.key, first = !ocrP;
  setAi({busy:true,msg: first ? "Getting the on-phone reader ready. The first time takes a little longer…" : "Reading on this phone…"});
  try {
    const [w, dict] = await Promise.all([getOcr(), getDict()]);
    const blobs = (await Promise.all(cur.photos.slice(-2).map(p=>Store.photoBlob(p)))).filter(Boolean);
    if (!blobs.length) throw new Error("no photo");
    const merged = {unclear:[]}, texts = [];
    for (let i=0;i<blobs.length;i++) {
      ocrProgress = p => { if (cur && cur.key===forKey) setAi({busy:true,msg:"Reading on this phone… photo "+(i+1)+" of "+blobs.length+", "+Math.round(p*100)+"%"}); };
      let res = parsePlate(wordsOf((await w.recognize(await prep(blobs[i],false), {}, {text:true,blocks:true})).data), dict);
      if (res.strong<4) { const inv = parsePlate(wordsOf((await w.recognize(await prep(blobs[i],true), {}, {text:true,blocks:true})).data), dict); if (inv.strong>res.strong) res = inv; }
      if (res.text) texts.push(res.text);
      for (const k of ["make","model","serial","manufacture_date","details"]) if (!merged[k] && res[k]) { merged[k] = res[k]; if (res.unclear.includes(k)) merged.unclear.push(k); }
    }
    ocrProgress = null;
    merged.barcode = await detectBarcode(blobs);
    if (!cur || cur.key!==forKey) return;
    $("rawpre").textContent = texts.join("\n\n"); $("rawtext").hidden = !texts.length;
    const got = await applyRead(merged, forKey); if (!got) return;
    const un = (merged.unclear.includes("make") ? " The make is a guess." : "")+(merged.unclear.includes("model") ? " The model was matched to the closest one already in AFM." : "");
    setAi({retry:true, online:true, bad:!got.length, msg: got.length ? "Read on this phone: "+got.join(", ")+"."+un+" Check each against the plate. Choose the asset type yourself."+(onlineOk()?" Online OCR reads worn or stamped plates better.":"")
      : (texts.length ? "Text was found but no make, model or serial could be picked out. Open the text below, or retake the photo closer and square on." : "No text could be read. Retake the photo closer, square on and out of glare.")});
  } catch(e) {
    ocrProgress = null;
    if (cur && cur.key===forKey) setAi({bad:true, retry:true, online:true, msg:"The on-phone reader could not start in this view."+(onlineOk()?" Try Online OCR, or type the details.":" Type the details below.")});
  }
}

/* --- reader 2: Online OCR (OCR.space). The photo is sent to that service; needs a connection and a free API key. --- */
const onlineKey = () => { try { return (localStorage.getItem("pmbh-ocrkey")||"").trim(); } catch(e) { return ""; } };
async function shrinkFor(blob, maxBytes){
  const bmp = await createImageBitmap(blob); let side = 2200, q = .85, out = blob;
  for (let i=0;i<7;i++) {

    c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    out = await new Promise(res => c.toBlob(res,"image/jpeg",q));
    if (out && out.size<=maxBytes) return out;
    side = Math.round(side*.85); q = Math.max(.6, q-.05);

}
async function readOnline(){
  if (!cur || !cur.photos.length) return;
  if (!onlineOk()) return openHelp();
  if (!Store.online()) return setAi({bad:true,retry:true,msg:"No connection. Use the on-phone reader now, and Online OCR when you have signal."});
  if (aiCtl) aiCtl.abort();
  const ctl = aiCtl = new AbortController(), forKey = cur.key;
  setAi({busy:true,msg:"Online OCR is reading the plate…",stop:true});
  try {
    const dict = await getDict();
    const blobs = (await Promise.all(cur.photos.slice(-2).map(p=>Store.photoBlob(p)))).filter(Boolean);
    if (!blobs.length) throw {code:"photo"};
    const merged = {unclear:[]}, texts = [];
    for (const b of blobs) {
      const fd = new FormData();

      fd.append("scale","true"); fd.append("detectOrientation","true"); fd.append("file", await shrinkFor(b, 950000), "plate.jpg");

      if (!r.ok) throw {code:"http"};

      const res = parsePlate(words, dict);
      if (res.text) texts.push(res.text);
      for (const k of ["make","model","serial","manufacture_date","details"]) if (!merged[k] && res[k]) { merged[k] = res[k]; if (res.unclear.includes(k)) merged.unclear.push(k); }
    }
    merged.barcode = await detectBarcode(blobs);
    if (!cur || cur.key!==forKey) return;
    $("rawpre").textContent = texts.join("\n\n"); $("rawtext").hidden = !texts.length;
    const got = await applyRead(merged, forKey); if (!got) return;
    const un = (merged.unclear.includes("make") ? " The make is a guess." : "")+(merged.unclear.includes("model") ? " The model was matched to the closest one already in AFM." : "");
    setAi({retry:true, bad:!got.length, msg: got.length ? "Online OCR read "+got.join(", ")+"."+un+" Check each against the plate. Choose the asset type yourself."
      : (texts.length ? "Text was found but no make, model or serial could be picked out. Open the text below, or retake the photo closer and square on." : "No text could be read. Retake the photo closer, square on and out of glare.")});

    if (!cur || cur.key!==forKey) return;
    const code = e && e.code;
    if (e && e.name==="AbortError") return setAi({msg:"Stopped. Type the details or read again.",retry:true});
    setAi({bad:true,retry:true,msg: code==="key" ? "The Online OCR key was not accepted. Check it in Setup." : code==="api" ? "Online OCR could not process the photo"+(e.message?": "+e.message.slice(0,120):".")+" Use the on-phone reader or type the details."
      : "Online OCR could not be reached. Use the on-phone reader, or try again when the signal is better."});

/* ---------- sheets ---------- */
function openSheet(title, build){
  const body = el("div",{class:"body"});
  const close = () => scrim.remove();
  const scrim = el("div",{class:"scrim",onclick:e=>{ if (e.target===scrim) close(); }},
    el("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":title}, el("header",{}, el("h2",{text:title}), el("button",{type:"button",class:"x","aria-label":"Close",text:"×",onclick:close})), body));
  $("sheets").append(scrim); build(body, close); return close;
}
function confirmSheet(title, msg, yes, danger){

    const close = openSheet(title, (body, c) => { body.append(el("p",{text:msg,style:"margin:0"}),
      el("div",{class:"row2"}, el("button",{type:"button",class:"btn",text:"Cancel",onclick:()=>{done=true;c();res(false);}}), el("button",{type:"button",class:"btn "+(danger?"danger":"primary"),text:yes,onclick:()=>{done=true;c();res(true);}}))); });
    const obs = new MutationObserver(()=>{ if (!done && !$("sheets").children.length) { obs.disconnect(); res(false); } }); obs.observe($("sheets"),{childList:true});
  });
}

    const choose = v => { cur[k] = v; dirty = true; aiFilled.delete(k); if (NAMEPARTS.includes(k) && !cur.nameManual) cur.name = buildName(cur); if (k==="atype") queueSugg(); close(); renderForm(); };
    const L = await loadList(f.src);
    const show = v => (v.startsWith(S.strip)?v.slice(S.strip.length):v).trim();
    let group = "";
    const draw = () => {
      res.replaceChildren();
      const q = input.value.trim();
      let items;
      if (!q && L.meta && !group) {
        const counts = {}; for (const o of L.meta) counts[o.g] = (counts[o.g]||0)+1;
        const tiles = el("div",{class:"tiles"});
        for (const g of Object.keys(ICON).filter(g=>counts[g])) { const b = el("button",{type:"button",class:"tile",onclick:()=>{ group = g; draw(); }}); b.insertAdjacentHTML("beforeend", ICON[g]); b.append(g, el("small",{text:counts[g]+" types"})); tiles.append(b); }
        res.append(el("div",{class:"note",text:"Pick a discipline, or type above to search all "+L.raw.length+" asset types in the Asset Data Standard.",style:"padding:4px 0 8px"}), tiles);
        items = [];
      } else if (!q && L.meta) {
        res.append(el("button",{type:"button",class:"free",text:"‹ All disciplines",onclick:()=>{ group = ""; draw(); }}));
        items = L.meta.filter(o=>o.g===group).map(o=>o.t).sort();
      } else if (!q) {
        const recent = [...new Set(records.map(r=>r[k]).filter(Boolean).reverse())].slice(0,8);
        items = k==="spec" && specSugg.length ? specSugg : recent;
        if (items.length) res.append(el("div",{class:"note",text:k==="spec"&&specSugg.length?"Closest matches for this make and model":"Used recently",style:"padding:4px 0"}));
        else res.append(el("div",{class:"note",text: L.failed ? "Lists are not loaded yet. Open Setup on the first screen and load the lists file. Until then, type the value and use it as written." : "Type to search "+L.raw.length.toLocaleString()+" entries from the template.",style:"padding:8px 0"}));
      } else {
        items = searchList(L, q);
        if (!items.length) res.append(el("div",{class:"note",text:"No match in the template list.",style:"padding:8px 0"}));
      }
      for (const v of items) res.append(el("button",{type:"button",text:show(v),onclick:()=>choose(v)}));
      if (q && !items.some(v=>v.trim().toUpperCase()===q.toUpperCase())) res.append(el("button",{type:"button",class:"free",onclick:()=>choose(q)}, "Use “"+q+"” as typed", el("small",{text:S.free || "Not in the template list. The data load may reject it."})));
      if (cur[k]) res.append(el("button",{type:"button",class:"free",text:"Clear this field",onclick:()=>choose("")}));
    };
    let t; input.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(draw,120); });
    if (k==="spec" && !specSugg.length && (cur.make||cur.model)) input.value = [cur.make,cur.model].filter(Boolean).join(" ");
    draw(); input.focus();
  });
}

/* ---------- save / delete ---------- */
async function saveCur(){
  const btn = $("btn-save"); btn.disabled = true; btn.textContent = "Saving…";
  let rec = Object.assign({}, cur); const removed = rec._removed || []; delete rec._removed;
  rec.updatedAt = new Date().toISOString();
  try {
    rec = await Store.put(rec);
    const i = records.findIndex(r=>r.key===rec.key); if (i>=0) records[i] = rec; else records.push(rec);
    removed.forEach(p=>Store.delPhoto(p));
    if (aiCtl) aiCtl.abort();
    cur = null; renderList(); show("list");
    const m = missing(rec); toast(rec._pending ? "Saved on this phone. It will sync when you are back online." : m.length ? "Saved. Still needs "+m.map(k=>F[k].label.toLowerCase()).join(" and ")+"." : "Asset saved.");
  } catch(e) {
    toast(e && e.code==="quota_exceeded" ? "Storage is full. Export and clear the list, then save again." : "Could not save. Check your connection and tap Save again.");
  } finally { btn.disabled = false; btn.textContent = "Save asset"; }
}
async function leaveEdit(){
  if (dirty && !(await confirmSheet("Discard changes?","This asset has changes that are not saved.","Discard",true))) return;
  if (aiCtl) aiCtl.abort();
  curAdded.forEach(p=>Store.delPhoto(p));
  cur = null; show("list");
}
async function deleteCur(){
  if (!(await confirmSheet("Delete this asset?","The asset and its photos are removed for good.","Delete",true))) return;
  try { await Store.del(cur.key); } catch(e) { return toast("Could not delete. Check your connection and try again."); }
  (cur.photos||[]).concat(cur._removed||[]).forEach(p=>Store.delPhoto(p));
  records = records.filter(r=>r.key!==cur.key); cur = null; renderList(); show("list"); toast("Asset deleted.");
}

/* ---------- export ---------- */
const safe = s => String(s||"").replace(/[^A-Za-z0-9._-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
const photoNames = (r,i) => (r.photos||[]).map((p,n) => String(i+1).padStart(3,"0")+"_"+(safe(r.barcode||r.id||r.serial||r.name)||"asset")+"_"+(n+1)+".jpg");
function buildWorkbook(withPhotos){
  const colKey = {}; for (const [k,f] of Object.entries(F)) if (f.col) colKey[f.col] = k;
  const rows = [HEADERS];
  records.forEach((r,i) => rows.push(HEADERS.map(h => {
    if (h==="CSTDCRECORDIDTX") return String(i+1);
    const k = colKey[h]; if (!k) return null;
    const v = r[k]; if (v==null || v==="") return null;
    if (F[k].type==="date") { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); return m ? {t:"n",v:(Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(1899,11,30))/864e5,z:"dd/mm/yyyy"} : String(v); }
    if (F[k].type==="number") { const n = Number(v); return isFinite(n) ? n : String(v); }
    return {t:"s",v:String(v)};
  })));
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = HEADERS.map(h => ({wch:Math.max(14,h.length+2)}));
  const log = [["Record ID","Asset ID","Name","Asset type","Service area","Asset label","Capacity / energy / utility","Make","Model","Serial number","Other nameplate details","Photo files","Captured","Still missing"]];
  records.forEach((r,i) => log.push([String(i+1), r.id||"", r.name||"", r.atype||"", r.area||"", r.label||"", r.cap||"", r.make||"", r.model||"", r.serial||"", r.notes||"", withPhotos ? photoNames(r,i).map(n=>"Photos/"+n).join("; ") : (r.photos||[]).length+" photo(s) in the app", (r.createdAt||"").slice(0,16).replace("T"," "), missing(r).map(k=>F[k].label).join(", ")]));
  const ws2 = XLSX.utils.aoa_to_sheet(log); ws2["!cols"] = [10,14,34,24,16,14,20,18,22,22,44,44,18,22].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "triBuildingEquipment Data");
  XLSX.utils.book_append_sheet(wb, ws2, "Capture Log");
  return new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
async function saveFile(filename, blob){
  const file = new File([blob], filename, {type:blob.type || "application/octet-stream"});
  if (matchMedia("(pointer:coarse)").matches && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:filename}); return; }
    catch(e) { if (e && e.name==="AbortError") throw {code:"declined"}; }
  }
  const a = el("a",{href:URL.createObjectURL(blob),download:filename}); document.body.append(a); a.click(); a.remove();
}
const XLSX_NAME = () => "AFMO-triBuildingEquipment_Update_PMBH_"+today()+".xlsx";
async function doExport(kind, btn, status){
  const label = btn.textContent; btn.disabled = true;
  try {
    if (typeof XLSX==="undefined" || (kind==="zip" && typeof JSZip==="undefined")) throw {code:"lib"};
    let blob, name, lost = 0;
    if (kind==="xlsx") { blob = buildWorkbook(false); name = XLSX_NAME(); }
    else {
      const zip = new JSZip(); zip.file(XLSX_NAME(), buildWorkbook(true));
      const total = records.reduce((n,r)=>n+(r.photos||[]).length,0); let done = 0;
      for (let i=0;i<records.length;i++) { const names = photoNames(records[i],i);
        for (let n=0;n<names.length;n++) { status.textContent = "Collecting photo "+(++done)+" of "+total+"…"; const b = await Store.photoBlob(records[i].photos[n]); if (b) zip.file("Photos/"+names[n], b); else lost++; } }
      status.textContent = "Packing…";
      blob = await zip.generateAsync({type:"blob",compression:"STORE",mimeType:"application/zip"}); name = "PMBH Asset Capture "+today()+".zip";
    }
    status.textContent = "";
    await saveFile(name, blob);
    status.textContent = "Saved "+name+"."+(lost ? " "+lost+" photo(s) could not be fetched and are missing from the ZIP." : "");
  } catch(e) {
    const code = e && e.code;
    status.textContent = code==="declined" ? "" : code==="lib" ? "The Excel library did not load. Check your connection and reload the page." : code==="rate_limited" ? "A save prompt is already open. Answer it, then try again." : "The file could not be saved. Try again.";
  } finally { btn.disabled = false; btn.textContent = label; }
}
function openExport(){
  openSheet("Export", (body, close) => {
    if (!records.length) return body.append(el("p",{text:"Add at least one asset first.",style:"margin:0"}));
    const need = records.filter(r=>missing(r).length).length, nPhotos = records.reduce((n,r)=>n+(r.photos||[]).length,0);
    const status = el("div",{class:"note",role:"status"});
    if (need) body.append(el("div",{class:"banner",style:"margin:0",text:need+" of "+records.length+" assets are missing a name or specification. The template will flag them when you validate."}));
    const b1 = el("button",{type:"button",class:"btn primary block",text:"Save Excel and photos (ZIP)"}), b2 = el("button",{type:"button",class:"btn block",text:"Save Excel only"});
    b1.onclick = () => doExport("zip", b1, status); b2.onclick = () => doExport("xlsx", b2, status);
    body.append(
      el("div",{class:"opt"}, el("h3",{text:"Excel with a Photos folder"}), el("p",{text:records.length+" assets and "+nPhotos+" photos. Unzips to this layout:"}),
        el("pre",{class:"tree",text:"PMBH Asset Capture "+today()+"/\n├─ "+XLSX_NAME()+"\n└─ Photos/\n   ├─ 001_<barcode>_1.jpg\n   └─ …"}), b1),
      el("div",{class:"opt"}, el("h3",{text:"Excel only"}), el("p",{text:"One workbook. The first sheet has the 36 columns of triBuildingEquipment Data in template order; the second lists make, model and photo details."}), b2),
      status,
      el("div",{class:"opt"}, el("h3",{text:"Clear the list"}), el("p",{text:"After the export is safely in OneDrive, remove these assets and photos to start the next batch."}),
        el("button",{type:"button",class:"btn danger block",text:"Delete all "+records.length+" assets",onclick:async()=>{ close(); if (!(await confirmSheet("Delete all assets?","All "+records.length+" assets and their photos are removed for good. Do this only after the export is saved.","Delete all",true))) return;
          const left = []; for (const r of records) { try { await Store.del(r.key); (r.photos||[]).forEach(p=>Store.delPhoto(p)); } catch(e) { left.push(r); } }
          records = left; renderList(); toast(left.length ? left.length+" assets could not be deleted. Try again." : "List cleared."); }})));
  });
}
const APP_VERSION = "17 Nov 2026, build 3";

  openSheet("Setup", async body => {
    const p = await getPack();
    const key = el("input",{type:"text",id:"ocr-key",placeholder:"Paste your OCR.space API key",autocomplete:"off",autocapitalize:"off",spellcheck:"false",style:"width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)"}); key.value = onlineKey();

async function loadRecords(){
  const b = $("banner");
  try { records = (await Store.list()).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))); b.hidden = true;
    if (Store.cloudDown) { b.hidden = false; b.className = "banner"; b.replaceChildren("No connection. Only assets waiting on this phone are shown; new ones are kept here until you are back online. ", el("button",{type:"button",class:"btn",text:"Try again",style:"min-height:36px;margin-left:6px",onclick:()=>{ b.textContent = "Loading…"; loadRecords(); }})); }
    else doSync(false); }
  catch(e) { b.hidden = false; b.className = "banner bad"; b.replaceChildren("Your saved assets could not be loaded. ", el("button",{type:"button",class:"btn",text:"Try again",style:"min-height:36px;margin-left:6px",onclick:()=>{ b.textContent = "Loading…"; loadRecords(); }})); }
  renderList();
}
let syncing = false;
async function doSync(say){
  if (syncing) return; syncing = true;
  try {
    if (Store.cloudDown && Store.online()) { syncing = false; return loadRecords(); }
    const done = await Store.syncPending();
    for (const c of done) { const i = records.findIndex(r=>r.key===c.key); if (i>=0) records[i] = c; }
    if (done.length) { if ($("view-edit").hidden) renderList(); toast(done.length+(done.length===1?" asset":" assets")+" synced to your account."); }
    else if (say) toast(Store.online() ? "Could not sync yet. Try again shortly." : "Still offline. Your assets are safe on this phone.");
  } catch(e) {} finally { syncing = false; }
}
window.addEventListener("online", () => doSync(false));

  $("summary").append(el("span",{class:"chip",text:"Opening your asset list…"}));
  Store.ready = Store.init();
  for (const n of Object.keys(SRC)) loadList(n);
  renderReader();
  await Store.ready;
  await loadRecords();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  setTimeout(() => { getOcr().catch(()=>{}); getDict(); }, 2500);   // have the on-phone reader ready before it is needed
})();
